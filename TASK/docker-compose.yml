services:
  taskmanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-server
    environment:
      - TASK_MANAGER_TOKEN=${TASK_MANAGER_TOKEN:?TASK_MANAGER_TOKEN is required}
    ports:
      - "127.0.0.1:7000:7000"
    volumes:
      - "${YFEIEYE_TASK_STATE_ROOT:-/opt/yfeieye-source/shared/task}/config/generated:/app/config/generated"
    restart: unless-stopped
