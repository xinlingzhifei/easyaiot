      - GB28181_SSL_KEYSTORE_PASSWORD=${GB28181_SSL_KEYSTORE_PASSWORD:-}
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - MEDIA_SDP_IP=1.95.118.210 # GB28181 SDP 公网收流地址，避免摄像头向内网地址推流
      - MEDIA_STREAM_IP=eye.yfeiai.com # 播放地址对外展示域名
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=localhost:8848 # 配置中心地址（使用host网络模式，通过localhost访问）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=localhost:8848 # 注册中心地址（使用host网络模式，通过localhost访问）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://localhost:15432/iot-gb2818120?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（host网络模式访问宿主机映射端口）
      - SPRING_REDIS_HOST=localhost # Redis地址（host网络模式访问宿主机端口）
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-gb28181
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ${YFEIEYE_DEVICE_STATE_ROOT:-/opt/yfeieye-source/shared/device}/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    # 配置hosts映射，将PostgresSQL和Redis映射到宿主机IP（使用host-gateway自动解析为宿主机IP）
    # 这样使用host网络模式的服务可以通过服务名访问Docker网络中的服务
    extra_hosts:
      - "PostgresSQL:host-gateway"
      - "Redis:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always

networks:
  yfeieye-network:
    name: yfeieye-network
    external: true
