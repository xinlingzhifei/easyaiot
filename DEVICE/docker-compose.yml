    extra_hosts:
      - "kafka-server:host-gateway"
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48092/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - yfeieye-network
    depends_on:
      iot-system:
        condition: service_healthy

