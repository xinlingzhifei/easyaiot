# 构建：install_linux.sh 两阶段（Dockerfile.base 一次 Maven → target/jars → 各模块 Dockerfile）
# Maven 依赖缓存：项目根 .build-cache/device/m2/repository
services:
  iot-gateway:
    image: iot-gateway:latest
    container_name: iot-gateway
    user: root
    network_mode: host # 使用host网络模式，直接使用宿主机网络
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - IOT_RPC_INTERNAL_TOKEN=${IOT_RPC_INTERNAL_TOKEN:?IOT_RPC_INTERNAL_TOKEN is required}
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=localhost:8848 # 配置中心地址（使用host网络模式，通过localhost访问）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=localhost:8848 # 注册中心地址（使用host网络模式，通过localhost访问）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-gateway
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ${YFEIEYE_DEVICE_STATE_ROOT:-/opt/yfeieye-source/shared/device}/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48080/favicon.ico"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always

  iot-system:
    image: iot-module-system-biz:latest
    container_name: iot-system
    user: root
    ports:
      - "0.0.0.0:48099:48099"
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - IOT_RPC_INTERNAL_TOKEN=${IOT_RPC_INTERNAL_TOKEN:?IOT_RPC_INTERNAL_TOKEN is required}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-}
      - MYBATIS_ENCRYPTOR_PASSWORD=${MYBATIS_ENCRYPTOR_PASSWORD:-}
      - XXL_JOB_ACCESS_TOKEN=${XXL_JOB_ACCESS_TOKEN:-}
      - SMS_CALLBACK_TOKEN=${SMS_CALLBACK_TOKEN:?SMS_CALLBACK_TOKEN is required}
      - SPRING_PROFILES_ACTIVE=${IOT_SYSTEM_SPRING_PROFILES_ACTIVE:-local} # mini 形态由安装脚本设为 local,mini
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/ruoyi-vue-pro20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（使用Docker服务名）
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      - IOT_CAPTCHA_ENABLE=${IOT_CAPTCHA_ENABLE:-true} # 默认开启验证码；本地可通过环境变量覆盖
      - YFEIEYE_VIDEO_ALERT_RECORD_QUERY_URL=${YFEIEYE_VIDEO_ALERT_RECORD_QUERY_URL:-http://host.docker.internal:6000/video/alert/record/query} # 线索复核录像自动补证查询地址；未配置时降级为缺录像/待手动补证
      - YFEIEYE_VIDEO_RECORD_COVERAGE_QUERY_URL=${YFEIEYE_VIDEO_RECORD_COVERAGE_QUERY_URL:-http://host.docker.internal:6000/video/record/availability} # 线索复核录像覆盖度查询地址；未配置时返回缺录像覆盖
      - YFEIEYE_VIDEO_RECORD_BASE_URL=${YFEIEYE_VIDEO_RECORD_BASE_URL:-http://host.docker.internal:6000/video/record} # VIDEO录像基础地址；用于录像空间发现和覆盖度兜底
      - YFEIEYE_VIDEO_RECORD_EXPORT_URL=${YFEIEYE_VIDEO_RECORD_EXPORT_URL:-http://host.docker.internal:6000/video/record/export} # 线索复核证据录像导出地址；未配置时导出任务保留待补证状态
      - YFEIEYE_VIDEO_PUBLIC_PLAY_HOST=${YFEIEYE_VIDEO_PUBLIC_PLAY_HOST:-} # 浏览器公开 VIDEO 代理基址；生产示例 https://eye.yfeiai.com/yfeieye/dev-api
      - YFEIEYE_VIDEO_RECORD_EXPORT_CONNECT_TIMEOUT_MS=${YFEIEYE_VIDEO_RECORD_EXPORT_CONNECT_TIMEOUT_MS:-5000}
      - YFEIEYE_VIDEO_RECORD_EXPORT_READ_TIMEOUT_MS=${YFEIEYE_VIDEO_RECORD_EXPORT_READ_TIMEOUT_MS:-30000}
      - YFEIEYE_VIDEO_RECORD_EXPORT_POLL_TIMEOUT_MS=${YFEIEYE_VIDEO_RECORD_EXPORT_POLL_TIMEOUT_MS:-300000}
      - YFEIEYE_VIDEO_RECORD_EXPORT_DOWNLOAD_MAX_BYTES=${YFEIEYE_VIDEO_RECORD_EXPORT_DOWNLOAD_MAX_BYTES:-536870912}
      - YFEIEYE_VIDEO_RECORD_DRIFT_RETENTION_HOURS=${YFEIEYE_VIDEO_RECORD_DRIFT_RETENTION_HOURS:-24}
      - YFEIEYE_MEDIA_SERVICE_ID=${YFEIEYE_MEDIA_SERVICE_ID:-iot-system}
      - YFEIEYE_MEDIA_SERVICE_HMAC_SECRET=${YFEIEYE_MEDIA_SERVICE_HMAC_SECRET:-} # DEVICE->VIDEO HMAC；生产必须配置且与 VIDEO 一致
      - YFEIEYE_MEDIA_SERVICE_ALLOWED_ACTIONS=${YFEIEYE_MEDIA_SERVICE_ALLOWED_ACTIONS:-coverage,export,download,playback,manifest_verify}
      - YFEIEYE_MEDIA_SERVICE_ALLOWED_CAMERA_IDS=${YFEIEYE_MEDIA_SERVICE_ALLOWED_CAMERA_IDS:-} # 后台无用户上下文时显式摄像头范围；空值 fail-closed
      - YFEIEYE_REVIEW_CAMERA_PERMISSION_USERS_1=${YFEIEYE_REVIEW_CAMERA_PERMISSION_USERS_1:-}
      - YFEIEYE_EVIDENCE_MANIFEST_ACTIVE_KEY_ID=${YFEIEYE_EVIDENCE_MANIFEST_ACTIVE_KEY_ID:-}
      - YFEIEYE_EVIDENCE_MANIFEST_HMAC_KEYS=${YFEIEYE_EVIDENCE_MANIFEST_HMAC_KEYS:-} # keyId=base64(>=32 bytes), comma-separated; production required
      - YFEIEYE_EVIDENCE_MANIFEST_SIGNATURE_VERSION=${YFEIEYE_EVIDENCE_MANIFEST_SIGNATURE_VERSION:-hmac-sha256-v1}
      - YFEIEYE_REVIEW_LOCAL_SCHEDULER_ENABLED=${YFEIEYE_REVIEW_LOCAL_SCHEDULER_ENABLED:-false}
      - YFEIEYE_REVIEW_LOCAL_SCHEDULER_POOL_SIZE=${YFEIEYE_REVIEW_LOCAL_SCHEDULER_POOL_SIZE:-4}
      - YFEIEYE_REVIEW_RUNTIME_OUTBOX_NOTIFY_ENABLED=${YFEIEYE_REVIEW_RUNTIME_OUTBOX_NOTIFY_ENABLED:-false}
      - YFEIEYE_REVIEW_RUNTIME_OUTBOX_NOTIFY_TENANT_ADMIN_USER_ROUTES=${YFEIEYE_REVIEW_RUNTIME_OUTBOX_NOTIFY_TENANT_ADMIN_USER_ROUTES:-}
      - YFEIEYE_REVIEW_RUNTIME_ALERT_TEMPLATE_CODE=${YFEIEYE_REVIEW_RUNTIME_ALERT_TEMPLATE_CODE:-YFEIEYE_REVIEW_RUNTIME_ALERT}
      - YFEIEYE_REVIEW_OPERATIONS_REPORT_TEMPLATE_CODE=${YFEIEYE_REVIEW_OPERATIONS_REPORT_TEMPLATE_CODE:-YFEIEYE_REVIEW_OPERATIONS_REPORT}
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-system
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ${YFEIEYE_DEVICE_STATE_ROOT:-/opt/yfeieye-source/shared/device}/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48099/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      yfeieye-network:
        aliases:
          - system-server

  iot-infra:
    image: iot-module-infra-biz:latest
    container_name: iot-infra
    user: root
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - IOT_RPC_INTERNAL_TOKEN=${IOT_RPC_INTERNAL_TOKEN:?IOT_RPC_INTERNAL_TOKEN is required}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-}
      - MYBATIS_ENCRYPTOR_PASSWORD=${MYBATIS_ENCRYPTOR_PASSWORD:-}
      - XXL_JOB_ACCESS_TOKEN=${XXL_JOB_ACCESS_TOKEN:-}
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/ruoyi-vue-pro20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（使用Docker服务名）
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      - SPRING_RABBITMQ_HOST=localhost # RabbitMQ地址（如需要，请配置Docker服务名）
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=Kafka:9092 # Kafka地址（使用Docker服务名）
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-infra
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ${YFEIEYE_DEVICE_STATE_ROOT:-/opt/yfeieye-source/shared/device}/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48082"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - yfeieye-network
    depends_on:
      iot-system:
        condition: service_healthy

  iot-device:
    image: iot-module-device-biz:latest
    container_name: iot-device
    user: root
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms256m -Xmx320m
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - IOT_RPC_INTERNAL_TOKEN=${IOT_RPC_INTERNAL_TOKEN:?IOT_RPC_INTERNAL_TOKEN is required}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-}
      - MYBATIS_ENCRYPTOR_PASSWORD=${MYBATIS_ENCRYPTOR_PASSWORD:-}
      - XXL_JOB_ACCESS_TOKEN=${XXL_JOB_ACCESS_TOKEN:-}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - ZLM_SECRET=${ZLM_SECRET:?ZLM_SECRET is required}
      - GB28181_SIP_PASSWORD=${GB28181_SIP_PASSWORD:?GB28181_SIP_PASSWORD is required}
      - EMQX_WEBHOOK_TOKEN=${EMQX_WEBHOOK_TOKEN:?EMQX_WEBHOOK_TOKEN is required}
      - IOT_MESSAGE_INTERNAL_TOKEN=${IOT_MESSAGE_INTERNAL_TOKEN:?IOT_MESSAGE_INTERNAL_TOKEN is required}
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/iot-device20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（使用Docker服务名）
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      - MINIO_ENDPOINT=http://MinIO:9000 # Minio地址（使用Docker服务名）
      - SPRING_KAFKA_IOT_PRODUCER_BOOTSTRAP_SERVERS=Kafka:9092 # Kafka生产者地址（使用Docker服务名）
      - SPRING_KAFKA_IOT_CONSUMER_BOOTSTRAP_SERVERS=Kafka:9092 # Kafka消费者地址（使用Docker服务名）
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-device
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ${YFEIEYE_DEVICE_STATE_ROOT:-/opt/yfeieye-source/shared/device}/logs:/root/logs/
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - yfeieye-network
    depends_on:
      iot-infra:
        condition: service_healthy

  iot-dataset:
    image: iot-module-dataset-biz:latest
    container_name: iot-dataset
    user: root
    environment:
      - TZ=Asia/Shanghai # 配置程序默认时区为上海（中国标准时间）
      - JAVA_OPTS=-Xms512m -Xmx2g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/root/logs/iot-dataset-oom.hprof -XX:+ExitOnOutOfMemoryError
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - IOT_RPC_INTERNAL_TOKEN=${IOT_RPC_INTERNAL_TOKEN:?IOT_RPC_INTERNAL_TOKEN is required}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-}
      - MYBATIS_ENCRYPTOR_PASSWORD=${MYBATIS_ENCRYPTOR_PASSWORD:-}
      - XXL_JOB_ACCESS_TOKEN=${XXL_JOB_ACCESS_TOKEN:-}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - ZLM_SECRET=${ZLM_SECRET:?ZLM_SECRET is required}
      - GB28181_SIP_PASSWORD=${GB28181_SIP_PASSWORD:?GB28181_SIP_PASSWORD is required}
      - SPRING_PROFILES_ACTIVE=local # 指定程序运行环境
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848 # 配置中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848 # 注册中心地址（使用Docker服务名）
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE= # 使用默认命名空间（public）
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/iot-device20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified # PostgreSQL数据库地址（使用Docker服务名）
      - SPRING_REDIS_HOST=Redis # Redis地址（使用Docker服务名）
      - MINIO_ENDPOINT=http://MinIO:9000 # Minio地址（使用Docker服务名）
      - MINIO_BASE_URL=http://MinIO:9000 # Minio基础URL（使用Docker服务名）
      # SkyWalking配置（如需要，请取消注释并配置）
      # - JAVA_TOOL_OPTIONS=-javaagent:/data/skywalking/skywalking-agent/skywalking-agent.jar
      # - SW_AGENT_NAME=iot-dataset
      # - SW_AGENT_TRACE_IGNORE_PATH=Redisson/PING,/actuator/**,/admin/**
      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ${YFEIEYE_DEVICE_STATE_ROOT:-/opt/yfeieye-source/shared/device}/logs:/root/logs/
      - /data/yolo_dataset:/data/yolo_dataset:ro
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - yfeieye-network
    depends_on:
      iot-infra:
        condition: service_healthy

  iot-node:
    image: iot-module-node-biz:latest
    container_name: iot-node
    user: root
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms256m -Xmx320m
      - NACOS_USERNAME=${NACOS_USERNAME:?NACOS_USERNAME is required}
      - NACOS_PASSWORD=${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      - IOT_RPC_INTERNAL_TOKEN=${IOT_RPC_INTERNAL_TOKEN:?IOT_RPC_INTERNAL_TOKEN is required}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - MYBATIS_ENCRYPTOR_PASSWORD=${MYBATIS_ENCRYPTOR_PASSWORD:-}
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=Nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_NAMESPACE=
      - SPRING_CLOUD_NACOS_SERVER_ADDR=Nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE=
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://PostgresSQL:5432/iot-node20?autoReconnect=true&autoReconnectForPools=true&useUnicode=true&characterEncoding=utf8&createDatabaseIfNotExist=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&stringtype=unspecified
      - SPRING_REDIS_HOST=Redis
      # 容器内 iot-node 纳管控制面节点时使用宿主机 IP（避免探测到容器网桥地址）
      - EASYAIOT_PLATFORM_HOST=${EASYAIOT_PLATFORM_HOST:-${HOST_IP:-}}
      - EASYAIOT_AGENT_CONTROL_PLANE_URL=${EASYAIOT_AGENT_CONTROL_PLANE_URL:-}
      - EASYAIOT_PLATFORM_AGENT_BOOTSTRAP_TOKEN=${EASYAIOT_PLATFORM_AGENT_BOOTSTRAP_TOKEN:-}
      - EASYAIOT_EDGE_JOIN_TOKEN=${EASYAIOT_EDGE_JOIN_TOKEN:-}
      - EASYAIOT_EDGE_ALLOW_OPEN_ENROLL=${EASYAIOT_EDGE_ALLOW_OPEN_ENROLL:-false}
      - EMQX_NODE_COOKIE=${EMQX_NODE_COOKIE:-}
      - EMQX_DASHBOARD_PASSWORD=${EMQX_DASHBOARD_PASSWORD:-}
      - ZLM_SECRET=${ZLM_SECRET:-}
    volumes:
      - ${YFEIEYE_DEVICE_STATE_ROOT:-/opt/yfeieye-source/shared/device}/node-logs:/root/logs/
      # Agent 源码目录（含 run_agent.py、install.sh 等，供控制面远程部署 Agent 使用）
      - ../NODE:/opt/easyaiot/NODE
      - ../VIDEO:/opt/easyaiot/VIDEO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:48094/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - yfeieye-network
    depends_on:
      iot-infra:
        condition: service_healthy

