      - BASICLAB_IOT_SINK_PROTOCOL_EMQX_MQTT_TOPICS=/iot/#,/shadow/#,$$share/algo-sink/mqtt/iot-alert-notification,$$share/algo-sink/mqtt/iot-snapshot-alert,$$share/algo-sink/mqtt/iot-post-process-request # 算法总线仅使用共享订阅，避免重复消费
