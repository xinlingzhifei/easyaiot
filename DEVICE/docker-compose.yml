      # - SW_AGENT_COLLECTOR_BACKEND_SERVICES=[YOUR_SKYWALKING_ADDR]
    volumes:
      - ${YFEIEYE_DEVICE_STATE_ROOT:-/opt/yfeieye-source/shared/device}/logs:/root/logs/
      # 告警图片目录（与VIDEO/算法进程共享，用于读取告警 JPG 并上传 MinIO）
      # 算法侧须挂载同一宿主机目录且设置 ALERT_IMAGES_DIR=/app/alert_images（见 VIDEO/app/utils/alert_images_paths.py）
      # 使用与 VIDEO 相同的 release 外状态根，发布切换后仍共享同一落盘目录
      - ${YFEIEYE_VIDEO_STATE_ROOT:-/data/yfeieye-video}/alert_images:/app/alert_images
      # full 形态工业协议演示：宿主机 /tmp 虚拟串口 + pts（.scripts/modbus-rtu-virtual-serial）
      - /tmp:/tmp
      - /dev/pts:/dev/pts
      # - /data/skywalking/skywalking-agent:/data/skywalking/skywalking-agent
    # 配置hosts映射，将kafka-server映射到宿主机IP
