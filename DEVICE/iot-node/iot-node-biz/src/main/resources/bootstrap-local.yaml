spring:
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        metadata:
          version: 1.0.0
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
      config:
        server-addr: localhost:8848
        group: DEFAULT_GROUP
        name: ${spring.application.name}
        file-extension: yaml
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
